[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-harness"
version = "0.2.0"
description = "Runtime membrane around agent loops — audit, policy, sequencer, and Skillware egress."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARPA Hellenic Logical Systems" }]
keywords = [
    "agents",
    "agent-harness",
    "ai-agents",
    "audit-trail",
    "aura",
    "compliance",
    "conformance",
    "governance",
    "observability",
    "policy",
    "runtime",
    "sidecar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://arpacorp.net"
Documentation = "https://github.com/ARPAHLS/aura#readme"
Repository = "https://github.com/ARPAHLS/aura"
Issues = "https://github.com/ARPAHLS/aura/issues"
Changelog = "https://github.com/ARPAHLS/aura/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
skillware = ["skillware>=0.5.1"]

[project.scripts]
aura = "aura.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
