[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-harness"
version = "0.3.4"
description = "Runtime membrane around agent loops — audit, policy, identity, and compliance export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARPA Hellenic Logical Systems" }]
keywords = [
    "agents",
    "agent-harness",
    "ai-agents",
    "audit-trail",
    "aura",
    "compliance",
    "conformance",
    "governance",
    "observability",
    "policy",
    "runtime",
    "sidecar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://arpacorp.net"
Documentation = "https://github.com/ARPAHLS/aura#readme"
Repository = "https://github.com/ARPAHLS/aura"
Issues = "https://github.com/ARPAHLS/aura/issues"
Changelog = "https://github.com/ARPAHLS/aura/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.22031863"
Zenodo = "https://doi.org/10.5281/zenodo.22031863"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=24.0", "flake8>=7.0"]
skillware = ["skillware>=0.5.4,<0.6"]
integrations = [
    "skillware>=0.5.4,<0.6",
    "ollama>=0.4.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
google = ["google-generativeai>=0.8"]
ollama = ["ollama>=0.4.0"]
identity = ["pyjwt>=2.8", "cryptography>=41"]

[project.scripts]
aura = "aura.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "skillware: requires skillware extra (pip install -e '.[skillware]')",
    "integration: live stack tests in tests/integration/ (Skillware + Ollama); excluded from default CI",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist", ".eggs"]
