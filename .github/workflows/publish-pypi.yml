# Publish aura-harness to PyPI when a GitHub Release is published or a v* tag is pushed.
#
# Setup (one-time on PyPI):
#   A) Trusted publishing (recommended): https://docs.pypi.org/trusted-publishers/
#      Add publisher: owner ARPAHLS, repo aura, workflow publish-pypi.yml
#   B) Or add secret PYPI_API_TOKEN (pypi-...) in GitHub repo settings
#
# Before tagging: bump version in pyproject.toml and aura/__init__.py to match the tag (e.g. v0.3.0).

name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          black --check aura tests
          flake8 aura tests
          pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Optional token auth — uncomment if not using PyPI trusted publishing:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
