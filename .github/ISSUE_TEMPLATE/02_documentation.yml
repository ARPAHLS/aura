name: Documentation
description: Docs, README, or glossary fix
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "README.md, docs/using-aura.md, …"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - typo / clarity
        - missing information
        - incorrect example
        - broken link
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
