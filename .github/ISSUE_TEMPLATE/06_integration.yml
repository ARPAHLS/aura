name: Membrane & pipeline
description: Sequencer, ingress/egress, observers, hosts/adapters, audit export, coat ops
title: "[Integration]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Membrane and pipeline integration (core package). For stack attach work under `integrations/` (Ollama, cloud APIs, Skillware, frameworks), use the **Stack integration** template.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - hosts / adapters (ToolHost, SkillwareHost)
        - membrane (ingress / egress)
        - sequencer
        - observers
        - audit & export (OTel, compare, verify)
        - coat ops
        - core examples (examples/)
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - bug
        - enhancement
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro or pipeline spec (optional)
      description: Sequencer YAML, host snippet, example path, or session export excerpt
