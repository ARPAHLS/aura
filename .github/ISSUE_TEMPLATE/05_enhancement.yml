name: Enhancement
description: New feature or improvement
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      description: Helps route the issue; leave as general if unsure
      options:
        - general
        - integrations
        - examples
        - cli
        - core framework
        - docs / onboarding
        - ci / testing
        - packaging

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
